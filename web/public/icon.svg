<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="45%" stop-color="#070a14" />
      <stop offset="100%" stop-color="#020409" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.75" />
      <stop offset="35%" stop-color="#334155" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#0f172a" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0.7" />
    </linearGradient>

    <!-- Ambient Glows -->
    <radialGradient id="indigoAmbient" cx="50%" cy="22%" r="55%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#4f46e5" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="tealAmbient" cx="50%" cy="78%" r="50%">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#0d9488" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="45%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#020409" stop-opacity="0" />
    </radialGradient>

    <!-- Server Blade Gradients -->
    <linearGradient id="bladeTopGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.98" />
    </linearGradient>

    <linearGradient id="bladeMidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242e4c" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0d1428" stop-opacity="0.98" />
    </linearGradient>

    <!-- Pilot Elements Gradients -->
    <linearGradient id="pilotTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c7d2fe" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <linearGradient id="pilotBottom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="70%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>

    <linearGradient id="pilotLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>

    <linearGradient id="pilotRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>

    <linearGradient id="circuitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect width="512" height="512" rx="114" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="114" fill="url(#indigoAmbient)" />
  <rect width="512" height="512" rx="114" fill="url(#tealAmbient)" />
  <rect x="1.5" y="1.5" width="509" height="509" rx="113" fill="none" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Central Radial Core Glow -->
  <circle cx="256" cy="256" r="160" fill="url(#coreGlow)" />

  <!-- Orbital Radar Grid & Telemetry Constellation -->
  <g opacity="0.28" stroke="#38bdf8" stroke-width="1.2" fill="none">
    <circle cx="256" cy="256" r="148" stroke-dasharray="4 8" />
    <circle cx="256" cy="256" r="102" stroke-dasharray="3 6" opacity="0.5" />
    <line x1="256" y1="84" x2="256" y2="428" stroke-dasharray="2 6" opacity="0.35" />
    <line x1="84" y1="256" x2="428" y2="256" stroke-dasharray="2 6" opacity="0.35" />
  </g>

  <!-- High-Speed Data Conduits (Linking Satellite Nodes to Core) -->
  <g stroke="url(#circuitGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.8">
    <path d="M160 148 L212 200 L256 228" />
    <path d="M352 148 L300 200 L256 228" />
    <path d="M160 364 L212 312 L256 284" />
    <path d="M352 364 L300 312 L256 284" />
  </g>

  <!-- Satellite Workload Nodes -->
  <g>
    <!-- Node Top-Left (Host Telemetry & Metrics) -->
    <circle cx="160" cy="148" r="14" fill="#070a14" stroke="#6366f1" stroke-width="2" />
    <circle cx="160" cy="148" r="5" fill="#818cf8" filter="url(#softGlow)" />

    <!-- Node Top-Right (Docker Containers & Workloads) -->
    <circle cx="352" cy="148" r="14" fill="#070a14" stroke="#06b6d4" stroke-width="2" />
    <circle cx="352" cy="148" r="5" fill="#22d3ee" filter="url(#softGlow)" />

    <!-- Node Bottom-Left (Storage & File Sandbox) -->
    <circle cx="160" cy="364" r="14" fill="#070a14" stroke="#3b82f6" stroke-width="2" />
    <circle cx="160" cy="364" r="5" fill="#60a5fa" />

    <!-- Node Bottom-Right (Systemd Units & Daemons) -->
    <circle cx="352" cy="364" r="14" fill="#070a14" stroke="#10b981" stroke-width="2" />
    <circle cx="352" cy="364" r="5" fill="#34d399" filter="url(#softGlow)" />
  </g>

  <!-- 3-Tier Homeserver Blade Chassis -->
  <!-- Blade 1: Top Node -->
  <g id="blade-top">
    <rect x="150" y="172" width="212" height="38" rx="8" fill="url(#bladeTopGrad)" stroke="#334155" stroke-width="1.5" />
    <!-- Bays -->
    <line x1="168" y1="191" x2="178" y2="191" stroke="#475569" stroke-width="3" stroke-linecap="round" />
    <line x1="184" y1="191" x2="194" y2="191" stroke="#475569" stroke-width="3" stroke-linecap="round" />
    <line x1="200" y1="191" x2="210" y2="191" stroke="#475569" stroke-width="3" stroke-linecap="round" />
    <!-- Active LED -->
    <circle cx="344" cy="191" r="3.5" fill="#34d399" filter="url(#softGlow)" />
  </g>

  <!-- Blade 3: Bottom Node -->
  <g id="blade-bottom">
    <rect x="150" y="302" width="212" height="38" rx="8" fill="url(#bladeTopGrad)" stroke="#334155" stroke-width="1.5" />
    <!-- Bays -->
    <line x1="168" y1="321" x2="178" y2="321" stroke="#475569" stroke-width="3" stroke-linecap="round" />
    <line x1="184" y1="321" x2="194" y2="321" stroke="#475569" stroke-width="3" stroke-linecap="round" />
    <line x1="200" y1="321" x2="210" y2="321" stroke="#475569" stroke-width="3" stroke-linecap="round" />
    <!-- Active LED -->
    <circle cx="344" cy="321" r="3.5" fill="#2dd4bf" filter="url(#softGlow)" />
  </g>

  <!-- Blade 2: Middle Master Core Blade -->
  <g id="blade-middle">
    <rect x="134" y="234" width="244" height="44" rx="10" fill="url(#bladeMidGrad)" stroke="#4f46e5" stroke-width="1.8" />
    <!-- Bays -->
    <line x1="152" y1="256" x2="164" y2="256" stroke="#64748b" stroke-width="3.5" stroke-linecap="round" />
    <line x1="170" y1="256" x2="182" y2="256" stroke="#64748b" stroke-width="3.5" stroke-linecap="round" />
    <!-- Status LEDs -->
    <circle cx="352" cy="256" r="4" fill="#38bdf8" filter="url(#softGlow)" />
    <circle cx="364" cy="256" r="3" fill="#818cf8" />
  </g>

  <!-- Pilot Navigational Helm / Delta Nexus -->
  <g id="pilot-nexus" filter="url(#softGlow)">
    <!-- Outer Chevron Hexagonal Frame -->
    <path d="M256 112 L284 182 L326 256 L284 330 L256 400 L228 330 L186 256 L228 182 Z" 
          fill="none" stroke="url(#pilotTop)" stroke-width="3.2" stroke-linejoin="round" opacity="0.45" />

    <!-- Upper Pilot Wing / Pointer (Forward Vector) -->
    <path d="M256 104 L280 192 L256 178 L232 192 Z" 
          fill="url(#pilotTop)" />

    <!-- Lower Pilot Keel (Stabilizer Vector) -->
    <path d="M256 408 L280 320 L256 334 L232 320 Z" 
          fill="url(#pilotBottom)" />

    <!-- Left Wing (West Vector) -->
    <path d="M150 256 L226 232 L214 256 L226 280 Z" 
          fill="url(#pilotLeft)" />

    <!-- Right Wing (East Vector) -->
    <path d="M362 256 L286 232 L298 256 L286 280 Z" 
          fill="url(#pilotRight)" />
  </g>

  <!-- Central Luminous Control Reactor / Helm Hub -->
  <g id="control-core">
    <!-- Outer Reticle Ring -->
    <circle cx="256" cy="256" r="34" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="18 8" />
    <!-- Middle Core Shell -->
    <circle cx="256" cy="256" r="24" fill="#070a18" stroke="#818cf8" stroke-width="2.2" />
    <!-- Radiant Inner Glow -->
    <circle cx="256" cy="256" r="16" fill="url(#circuitGrad)" filter="url(#softGlow)" />
    <!-- Brilliant White Core Pulse Point -->
    <circle cx="256" cy="256" r="8" fill="#ffffff" filter="url(#intenseGlow)" />
    <circle cx="256" cy="256" r="4.5" fill="#ffffff" />
  </g>

  <!-- Precision Steering Accents (Radar Dots) -->
  <g fill="#38bdf8" opacity="0.85">
    <circle cx="256" cy="154" r="2.5" />
    <circle cx="256" cy="358" r="2.5" />
    <circle cx="194" cy="256" r="2.5" />
    <circle cx="318" cy="256" r="2.5" />
  </g>
</svg>